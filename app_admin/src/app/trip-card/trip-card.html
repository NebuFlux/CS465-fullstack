<div class="card h-100">
    <div class="card-header">{{trip.name}}</div>
    <img src="assets/images/{{trip.image}}" alt="trip thumbnail" class="card-img-top">
    <div class="card-body d-flex flex-column">
        <h6 class="card-subtitle mb-2 text-muted">
            {{trip.resort}}
        </h6>
        <p class="card-subtitle mt-3 mb-3 text-muted">
            {{trip.length}} only {{trip.perPerson|currency:'USD':'symbol'}} per person
        </p>
        <p class="card-text flex-grow-1" [innerHTML]="trip.description">
        </p>
        <div class="mt-auto">
            @if(isLoggedIn()) {
            <div class="d-flex justify-content-between align-items-center">
                <button (click)="editTrip(trip)" class="btn btn-info btn-sm">Edit Trip</button>
                <button (click)="deleteTrip(trip)" type="button" class="btn btn-danger btn-sm">
                Delete
                </button>
            </div>   
            }         
        </div>
    </div>
</div>
